<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="725" viewBox="0 0 1200 725" color="#1b2230" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Generic MCP architecture: the user asks the AI host; the LLM inside the host decides which tool to call; the MCP client sends tools/call to the MCP server, which runs the operation against the external system; the result flows back to the LLM, which answers."><defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect width="1200" height="725" fill="#f6f7f9"/><text x="30" y="38" font-size="20" font-weight="bold" fill="#1b2230" text-anchor="start" >How MCP works: the generic architecture</text><text x="30" y="60" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start" >One question, one tool call, one round trip. The dots show who talks to whom.</text><line x1="800" y1="84" x2="824" y2="84" stroke="#2563eb" stroke-width="2.5"/><text x="830" y="88" font-size="11" font-weight="normal" fill="#475569" text-anchor="start" >request</text><line x1="920" y1="84" x2="944" y2="84" stroke="#16a34a" stroke-width="2.5"/><text x="950" y="88" font-size="11" font-weight="normal" fill="#475569" text-anchor="start" >response</text><line x1="1040" y1="84" x2="1064" y2="84" stroke="#64748b" stroke-width="2.5" stroke-dasharray="5 4"/><text x="1070" y="88" font-size="11" font-weight="normal" fill="#475569" text-anchor="start" >discovery / transport</text><rect x="200" y="100" width="440" height="245" rx="14" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5" stroke-dasharray="6 4" /><text x="420" y="119" font-size="11" font-weight="bold" fill="#4338ca" text-anchor="middle" >AI HOST  (e.g. Claude Code, Claude Desktop, an IDE)</text><rect x="30" y="135" width="140" height="195" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" /><text x="100.0" y="160" font-size="14" font-weight="bold" fill="#1b2230" text-anchor="middle" >User</text><text x="100.0" y="195" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle" >asks a question</text><text x="100.0" y="210" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle" >in plain language</text><rect x="220" y="135" width="180" height="195" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" /><text x="310.0" y="160" font-size="14" font-weight="bold" fill="#1b2230" text-anchor="middle" >LLM</text><text x="310.0" y="177" font-size="11" font-weight="normal" fill="#475569" text-anchor="middle" font-family="Menlo, Consolas, monospace" >the model</text><text x="310.0" y="195" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle" >reads tool list,</text><text x="310.0" y="210" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle" >decides what to call</text><rect x="440" y="135" width="180" height="195" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" /><text x="530.0" y="160" font-size="14" font-weight="bold" fill="#1b2230" text-anchor="middle" >MCP Client</text><text x="530.0" y="177" font-size="11" font-weight="normal" fill="#475569" text-anchor="middle" font-family="Menlo, Consolas, monospace" >1 per server</text><text x="530.0" y="195" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle" >speaks the MCP</text><text x="530.0" y="210" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle" >protocol (JSON-RPC)</text><rect x="700" y="135" width="200" height="195" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" /><text x="800.0" y="160" font-size="14" font-weight="bold" fill="#1b2230" text-anchor="middle" >MCP Server</text><text x="800.0" y="177" font-size="11" font-weight="normal" fill="#475569" text-anchor="middle" font-family="Menlo, Consolas, monospace" >your program</text><text x="800.0" y="195" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle" >advertises tools,</text><text x="800.0" y="210" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle" >runs them on request</text><rect x="960" y="135" width="200" height="195" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" /><text x="1060.0" y="160" font-size="14" font-weight="bold" fill="#1b2230" text-anchor="middle" >External System</text><text x="1060.0" y="177" font-size="11" font-weight="normal" fill="#475569" text-anchor="middle" font-family="Menlo, Consolas, monospace" >DB · API · files</text><text x="1060.0" y="195" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle" >where the data</text><text x="1060.0" y="210" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle" >actually lives</text><rect x="244.4" y="307" width="131.2" height="18" rx="9" fill="#d97706" stroke="#d97706" stroke-width="1" /><text x="310" y="320" font-size="10.5" font-weight="bold" fill="#ffffff" text-anchor="middle" >DECIDES which tool</text><rect x="737.6" y="307" width="124.80000000000001" height="18" rx="9" fill="#d97706" stroke="#d97706" stroke-width="1" /><text x="800" y="320" font-size="10.5" font-weight="bold" fill="#ffffff" text-anchor="middle" >EXECUTES the tool</text><line x1="170" y1="245" x2="220" y2="245" stroke="#2563eb" stroke-width="2" marker-end="url(#a-blue)"/><circle cx="195.0" cy="230" r="9" fill="#2563eb" stroke="#ffffff" stroke-width="1.5"/><text x="195.0" y="234" font-size="10.5" font-weight="bold" fill="#ffffff" text-anchor="middle" >1</text><line x1="400" y1="245" x2="440" y2="245" stroke="#2563eb" stroke-width="2" marker-end="url(#a-blue)"/><circle cx="420.0" cy="230" r="9" fill="#2563eb" stroke="#ffffff" stroke-width="1.5"/><text x="420.0" y="234" font-size="10.5" font-weight="bold" fill="#ffffff" text-anchor="middle" >2</text><line x1="620" y1="245" x2="700" y2="245" stroke="#2563eb" stroke-width="2" marker-end="url(#a-blue)"/><circle cx="660.0" cy="230" r="9" fill="#2563eb" stroke="#ffffff" stroke-width="1.5"/><text x="660.0" y="234" font-size="10.5" font-weight="bold" fill="#ffffff" text-anchor="middle" >3</text><line x1="900" y1="245" x2="960" y2="245" stroke="#2563eb" stroke-width="2" marker-end="url(#a-blue)"/><circle cx="930.0" cy="230" r="9" fill="#2563eb" stroke="#ffffff" stroke-width="1.5"/><text x="930.0" y="234" font-size="10.5" font-weight="bold" fill="#ffffff" text-anchor="middle" >4</text><line x1="960" y1="290" x2="900" y2="290" stroke="#16a34a" stroke-width="2" marker-end="url(#a-green)"/><circle cx="930.0" cy="305" r="9" fill="#16a34a" stroke="#ffffff" stroke-width="1.5"/><text x="930.0" y="309" font-size="10.5" font-weight="bold" fill="#ffffff" text-anchor="middle" >5</text><line x1="700" y1="290" x2="620" y2="290" stroke="#16a34a" stroke-width="2" marker-end="url(#a-green)"/><circle cx="660.0" cy="305" r="9" fill="#16a34a" stroke="#ffffff" stroke-width="1.5"/><text x="660.0" y="309" font-size="10.5" font-weight="bold" fill="#ffffff" text-anchor="middle" >6</text><line x1="440" y1="290" x2="400" y2="290" stroke="#16a34a" stroke-width="2" marker-end="url(#a-green)"/><circle cx="420.0" cy="305" r="9" fill="#16a34a" stroke="#ffffff" stroke-width="1.5"/><text x="420.0" y="309" font-size="10.5" font-weight="bold" fill="#ffffff" text-anchor="middle" >7</text><line x1="220" y1="290" x2="170" y2="290" stroke="#16a34a" stroke-width="2" marker-end="url(#a-green)"/><circle cx="195.0" cy="305" r="9" fill="#16a34a" stroke="#ffffff" stroke-width="1.5"/><text x="195.0" y="309" font-size="10.5" font-weight="bold" fill="#ffffff" text-anchor="middle" >8</text><path d="M530,330 V372 H800 V330" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5"><animate attributeName="stroke-dashoffset" values="22;0" dur="1s" repeatCount="indefinite"/></path><circle cx="665" cy="372" r="9" fill="#64748b" stroke="#ffffff" stroke-width="1.5"/><text x="665" y="376" font-size="10.5" font-weight="bold" fill="#ffffff" text-anchor="middle" >0</text><text x="665" y="398" font-size="11.5" font-weight="normal" fill="#475569" text-anchor="middle" >Discovery, once at connect: client calls tools/list, server replies with each tool's name, description and JSON input schema</text><rect x="30" y="418" width="1140" height="36" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" /><text x="600" y="441" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle" opacity="0">1 · The user asks the host a question<animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.1141" values="1;0"/></text><text x="600" y="441" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle" opacity="0">2 · The LLM looks at the discovered tools and decides: call tool X with arguments Y<animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.1141;0.2126" values="0;1;0"/></text><text x="600" y="441" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle" opacity="0">3 · The MCP client sends a JSON-RPC tools/call request to the server<animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.2126;0.3335" values="0;1;0"/></text><text x="600" y="441" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle" opacity="0">4 · The MCP server runs the real operation against the external system<animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.3335;0.5200" values="0;1;0"/></text><text x="600" y="441" font-size="13" font-weight="bold" fill="#16a34a" text-anchor="middle" opacity="0">5 · Data comes back; the server wraps it as a JSON tool result<animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.5200;0.7574" values="0;1;0"/></text><text x="600" y="441" font-size="13" font-weight="bold" fill="#16a34a" text-anchor="middle" opacity="0">6 · The client hands the tool result to the LLM as new context<animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.7574;0.8559" values="0;1;0"/></text><text x="600" y="441" font-size="13" font-weight="bold" fill="#16a34a" text-anchor="middle" opacity="0">7 · The LLM writes the final answer for the user (or calls another tool first)<animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.8559" values="0;1"/></text><rect x="30" y="475" width="360" height="110" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" /><circle cx="50" cy="497" r="9" fill="#1b2230" stroke="#ffffff" stroke-width="1.5"/><text x="50" y="501" font-size="10.5" font-weight="bold" fill="#ffffff" text-anchor="middle" >1</text><text x="66" y="501" font-size="13" font-weight="bold" fill="#1b2230" text-anchor="start" >What is the host?</text><text x="46" y="523" font-size="12" font-weight="normal" fill="#475569" text-anchor="start" >The app the user talks to: Claude Code, Claude</text><text x="46" y="539" font-size="12" font-weight="normal" fill="#475569" text-anchor="start" >Desktop, an IDE. It runs the LLM, keeps the</text><text x="46" y="555" font-size="12" font-weight="normal" fill="#475569" text-anchor="start" >conversation and asks the user for permission.</text><rect x="420" y="475" width="360" height="110" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" /><circle cx="440" cy="497" r="9" fill="#1b2230" stroke="#ffffff" stroke-width="1.5"/><text x="440" y="501" font-size="10.5" font-weight="bold" fill="#ffffff" text-anchor="middle" >2</text><text x="456" y="501" font-size="13" font-weight="bold" fill="#1b2230" text-anchor="start" >What is the MCP client?</text><text x="436" y="523" font-size="12" font-weight="normal" fill="#475569" text-anchor="start" >A connector inside the host, one per server.</text><text x="436" y="539" font-size="12" font-weight="normal" fill="#475569" text-anchor="start" >Speaks JSON-RPC: initialize, tools/list,</text><text x="436" y="555" font-size="12" font-weight="normal" fill="#475569" text-anchor="start" >tools/call. It does no reasoning of its own.</text><rect x="810" y="475" width="360" height="110" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" /><circle cx="830" cy="497" r="9" fill="#1b2230" stroke="#ffffff" stroke-width="1.5"/><text x="830" y="501" font-size="10.5" font-weight="bold" fill="#ffffff" text-anchor="middle" >3</text><text x="846" y="501" font-size="13" font-weight="bold" fill="#1b2230" text-anchor="start" >What is the MCP server?</text><text x="826" y="523" font-size="12" font-weight="normal" fill="#475569" text-anchor="start" >A separate program that wraps one system and</text><text x="826" y="539" font-size="12" font-weight="normal" fill="#475569" text-anchor="start" >advertises tools (name, description, schema).</text><text x="826" y="555" font-size="12" font-weight="normal" fill="#475569" text-anchor="start" >It contains no LLM.</text><rect x="30" y="597" width="360" height="110" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" /><circle cx="50" cy="619" r="9" fill="#1b2230" stroke="#ffffff" stroke-width="1.5"/><text x="50" y="623" font-size="10.5" font-weight="bold" fill="#ffffff" text-anchor="middle" >4</text><text x="66" y="623" font-size="13" font-weight="bold" fill="#1b2230" text-anchor="start" >Who decides which tool to call?</text><text x="46" y="645" font-size="12" font-weight="normal" fill="#475569" text-anchor="start" >The LLM inside the host, from the user's</text><text x="46" y="661" font-size="12" font-weight="normal" fill="#475569" text-anchor="start" >question and the tool descriptions it saw.</text><text x="46" y="677" font-size="12" font-weight="normal" fill="#475569" text-anchor="start" >The server only answers calls it receives.</text><rect x="420" y="597" width="360" height="110" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" /><circle cx="440" cy="619" r="9" fill="#1b2230" stroke="#ffffff" stroke-width="1.5"/><text x="440" y="623" font-size="10.5" font-weight="bold" fill="#ffffff" text-anchor="middle" >5</text><text x="456" y="623" font-size="13" font-weight="bold" fill="#1b2230" text-anchor="start" >Where does the operation execute?</text><text x="436" y="645" font-size="12" font-weight="normal" fill="#475569" text-anchor="start" >In the MCP server process, against the</text><text x="436" y="661" font-size="12" font-weight="normal" fill="#475569" text-anchor="start" >external system. The LLM never touches that</text><text x="436" y="677" font-size="12" font-weight="normal" fill="#475569" text-anchor="start" >system or its credentials directly.</text><rect x="810" y="597" width="360" height="110" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" /><circle cx="830" cy="619" r="9" fill="#1b2230" stroke="#ffffff" stroke-width="1.5"/><text x="830" y="623" font-size="10.5" font-weight="bold" fill="#ffffff" text-anchor="middle" >6</text><text x="846" y="623" font-size="13" font-weight="bold" fill="#1b2230" text-anchor="start" >How does the result reach the user?</text><text x="826" y="645" font-size="12" font-weight="normal" fill="#475569" text-anchor="start" >Server -&gt; JSON tool result -&gt; client -&gt; LLM</text><text x="826" y="661" font-size="12" font-weight="normal" fill="#475569" text-anchor="start" >context. The LLM reads it and writes the</text><text x="826" y="677" font-size="12" font-weight="normal" fill="#475569" text-anchor="start" >answer, or calls another tool if it needs more.</text><g id="moving-events"><rect x="27" y="132" width="146" height="201" rx="12" fill="none" stroke="#2563eb" stroke-width="3" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.0010;0.0200;0.0550;0.9300;0.9500;0.9850;1.0000" values="0;0;1;0;0;1;0;0"/></rect><rect x="217" y="132" width="186" height="201" rx="12" fill="none" stroke="#d97706" stroke-width="3" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.0941;0.1141;0.1491;0.8359;0.8559;0.8909;1.0000" values="0;0;1;0;0;1;0;0"/></rect><rect x="437" y="132" width="186" height="201" rx="12" fill="none" stroke="#2563eb" stroke-width="3" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.1926;0.2126;0.2476;0.7374;0.7574;0.7924;1.0000" values="0;0;1;0;0;1;0;0"/></rect><rect x="697" y="132" width="206" height="201" rx="12" fill="none" stroke="#d97706" stroke-width="3" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.3135;0.3335;0.3685;0.6165;0.6365;0.6715;1.0000" values="0;0;1;0;0;1;0;0"/></rect><rect x="957" y="132" width="206" height="201" rx="12" fill="none" stroke="#2563eb" stroke-width="3" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.4300;0.4500;0.4850;0.5000;0.5200;0.5550;1.0000" values="0;0;1;0;0;1;0;0"/></rect><g opacity="0"><circle r="7" fill="#2563eb" stroke="#ffffff" stroke-width="2"/><text x="0" y="-13" font-size="11" font-weight="bold" fill="#2563eb" text-anchor="middle" font-family="Menlo, Consolas, monospace" stroke="#f6f7f9" stroke-width="4" paint-order="stroke">tools/call</text><animateMotion path="M 100,245 L 1060,245" dur="10s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0200;0.4500;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.0200;0.0260;0.4440;0.4500;1" values="0;0;1;1;0;0"/></g><g opacity="0"><circle r="7" fill="#16a34a" stroke="#ffffff" stroke-width="2"/><text x="0" y="-13" font-size="11" font-weight="bold" fill="#16a34a" text-anchor="middle" font-family="Menlo, Consolas, monospace" stroke="#f6f7f9" stroke-width="4" paint-order="stroke">result</text><animateMotion path="M 1060,290 L 100,290" dur="10s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.5200;0.9500;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.5200;0.5260;0.9440;0.9500;1" values="0;0;1;1;0;0"/></g></g></svg>
