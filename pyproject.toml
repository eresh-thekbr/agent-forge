    "langchain-postgres>=0.0.18",
    "langgraph>=1.2.11",
    "psycopg[binary]>=3.3.6",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.0.1",
    "streamlit>=1.64.0",
]
